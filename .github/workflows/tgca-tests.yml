name: Vérification du site TGCA
on:
  push:
    branches: [main]
    paths:
      - "fullstack/**"
      - ".github/workflows/tgca-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install -r fullstack/requirements.txt -r fullstack/requirements-dev.txt
      - name: Tester l'application
        run: |
          cd fullstack
          python -m pytest -q tests
