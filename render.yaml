# Demonstration gratuite : application FastAPI complète.
# IMPORTANT : le plan Render gratuit a un disque éphémère.
# Les devis, fichiers, projets et comptes créés en SQLite peuvent disparaître.
# Pour un usage client réel : base et stockage persistants, SMTP et sauvegardes.
services:
  - type: web
    name: tgca-construction
    runtime: python
    plan: free
    rootDir: fullstack
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TGCA_DATA_DIR
        value: /opt/render/project/src/data
      - key: WHATSAPP_NUMBER
        value: "212661258515"
      # À renseigner avec l'URL Render ou le domaine final (canonical, sitemap) :
      # - key: SITE_URL
      #   value: https://tgca-construction.onrender.com
