{% extends 'base.html' %}{% block content %}
<section class="portal-section"><div class="container narrow-container">
<a href="{{ '/admin' if user.role=='admin' else '/espace-client' }}" class="text-link back-link">← Retour</a>
<div class="form-card">
<div class="form-heading"><span class="eyebrow">Sécurité du compte</span><h1 class="h2-like">Changer mon mot de passe</h1><p>Utilisez au moins 12 caractères. Une phrase de plusieurs mots est plus simple à retenir et plus robuste.</p></div>
{% if error %}<div class="form-alert" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/mon-compte/mot-de-passe" class="stack-form">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field"><label for="current">Mot de passe actuel</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
<div class="field"><label for="new">Nouveau mot de passe</label><input id="new" name="new" type="password" minlength="12" required autocomplete="new-password"></div>
<div class="field"><label for="confirm">Confirmer le nouveau mot de passe</label><input id="confirm" name="confirm" type="password" minlength="12" required autocomplete="new-password"></div>
<button class="btn btn-gold" type="submit">Enregistrer le nouveau mot de passe</button>
</form></div></div></section>
{% endblock %}
